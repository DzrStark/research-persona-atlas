<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="16 种科研人格的完整解读：思考习惯、科研日常、合作方式与成长建议。">
  <meta property="og:title" content="16 种科研人格，你实验室里谁最像？">
  <meta property="og:description" content="从组会口头禅到科研小剧场，认识 16 位原创研究角色，阅读完整人物故事。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dzrstark.github.io/research-persona-atlas/portraits.html">
  <meta property="og:image" content="https://dzrstark.github.io/research-persona-atlas/assets/social-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="科研人格图谱原创角色与双画像">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="16 种科研人格，你实验室里谁最像？">
  <meta name="twitter:description" content="不用答题，也可以先逛逛科研人格宇宙。">
  <meta name="twitter:image" content="https://dzrstark.github.io/research-persona-atlas/assets/social-cover.png">
  <title>人格手册 · 科研人格图谱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">RESEARCH <span>PERSONA ATLAS</span></a><nav><a href="index.html#test">开始测评</a><a href="index.html#atlas">人格图谱</a></nav></header>
  <main class="portrait-library">
    <section class="library-intro">
      <p class="eyebrow">THE RESEARCH CHARACTERS</p>
      <h1>16 种研究者，<br>16 种与问题相处的方式。</h1>
      <p>有些人先问为什么，有些人先跑一版。有人把世界读成论文，有人把论文变成工具。翻翻这些角色，看看你在哪些地方认出了自己。</p>
      <label for="personaPicker">选择一位研究角色</label>
      <select id="personaPicker"></select>
      <p class="muted">这里是人格手册，不是你的测评结果。你也可以同时对多个角色产生共鸣。</p>
    </section>
    <section class="library-gallery-section" aria-label="16 种科研人格画廊"><div id="libraryGallery" class="character-gallery"></div></section>
    <section class="panel result-panel library-result">
      <article id="libraryCard" class="persona-card actual">
        <span id="libraryEnglish"></span>
        <h2 id="libraryName" tabindex="-1"></h2>
        <div id="libraryPortrait" class="portrait-content"></div>
      </article>
      <div class="library-navigation"><button class="button ghost" id="previousPersona">← 上一位</button><button class="button primary" id="nextPersona">下一位 →</button></div>
    </section>
  </main>
  <footer><a href="index.html">返回科研人格图谱</a><span>角色没有高低等级，也不定义你的全部。</span></footer>
  <script src="data.js"></script>
  <script src="personas.js"></script>
  <script src="portraits.js"></script>
  <script src="portrait-chapters.js"></script>
  <script src="presentation.js"></script>
  <script src="portrait-library.js"></script>
</body>
</html>
